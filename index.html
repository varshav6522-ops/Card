<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Varsha - Student Profile Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f0f0f3;
      color: #333746;
    }

    .profile-card {
      width: 100%;
      max-width: 340px;
      padding: 34px 28px;
      text-align: center;
      background: #f0f0f3;
      border-radius: 28px;
      box-shadow: 12px 12px 24px #ceced1,
                  -12px -12px 24px #ffffff;
    }

    .avatar {
      width: 112px;
      height: 112px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #f0f0f3;
      box-shadow: inset 6px 6px 12px #ceced1,
                  inset -6px -6px 12px #ffffff;
      color: #5d6475;
      font-size: 38px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 28px;
      letter-spacing: 0.4px;
    }

    .designation {
      display: inline-block;
      margin-bottom: 26px;
      padding: 9px 18px;
      border-radius: 20px;
      color: #707789;
      font-size: 14px;
      box-shadow: inset 3px 3px 6px #ceced1,
                  inset -3px -3px 6px #ffffff;
    }

    .details {
      padding: 18px;
      text-align: left;
      border-radius: 18px;
      box-shadow: inset 5px 5px 10px #ceced1,
                  inset -5px -5px 10px #ffffff;
    }

    .label {
      margin-bottom: 7px;
      color: #858b9a;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .interest {
      font-size: 16px;
      line-height: 1.5;
    }

    .book-icon {
      margin-right: 7px;
      font-size: 19px;
      vertical-align: -2px;
    }

    .footer {
      margin-top: 24px;
      color: #8b90a0;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    @media (max-width: 360px) {
      .profile-card {
        padding: 28px 22px;
      }
    }
  </style>
</head>
<body>
  <main class="profile-card" aria-label="Student profile card">
    <div class="avatar" aria-label="Initials V">V</div>
    <h1>Varsha</h1>
    <p class="designation">Student</p>

    <section class="details">
      <p class="label">Interest</p>
      <p class="interest"><span class="book-icon" aria-hidden="true">📚</span>Reading books</p>
    </section>

    <p class="footer">STUDENT PROFILE</p>
  </main>
</body>
</html>
